name: build-quantum-atlas

on:
  push:
    paths:
      - "quantum-atlas/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: quantum-atlas-windows
          - os: macos-latest
            target: mac
            artifact: quantum-atlas-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: quantum-atlas/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: quantum-atlas
        run: pnpm install --frozen-lockfile

      - name: Build (electron-builder)
        working-directory: quantum-atlas
        run: pnpm exec electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            quantum-atlas/dist/*.exe
            quantum-atlas/dist/*.dmg
          if-no-files-found: error

  # 手动触发时把产物挂到 release v2.0（CI 内下载 artifact 不走代理，比本地快）
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -la dist

      - name: Upload to release v2.0
        run: gh release upload v2.0 dist/* --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
